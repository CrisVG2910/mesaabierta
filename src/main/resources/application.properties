spring.application.name=mesaabierta-sumativa2
server.port=${PORT:8080}
server.servlet.context-path=/recetas
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework

# MySQL es obligatorio en ejecución normal; H2 solamente se utiliza en tests.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesaabierta?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:mesaabierta}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=mesaabierta-sumativa2
app.media.storage-dir=${MEDIA_STORAGE_DIR:./data/uploads}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080/recetas}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.max-age=1d
logging.level.org.springframework.security=WARN
