services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mesaabierta
      MYSQL_USER: mesaabierta
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta scripts/preparar-entorno.ps1 o crea .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [internal]
  mesaabierta:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: jdbc:mysql://db:3306/mesaabierta?useUnicode=true&characterEncoding=utf8
      DB_USER: mesaabierta
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Falta JWT_SECRET_BASE64 en .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/recetas}
      MEDIA_STORAGE_DIR: /app/data/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - media_data:/app/data/uploads
    security_opt:
      - no-new-privileges:true
    networks: [internal]
networks:
  internal:
volumes:
  mysql_data:
  media_data:
